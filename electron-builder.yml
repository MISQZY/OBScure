appId: com.obscure.app
productName: OBScure
directories:
  output: dist

# CI publishes a real GitHub Release on tag push (see .github/workflows/ci.yml,
# job "release", using the built-in GITHUB_TOKEN) so electron-updater has a
# stable, unauthenticated URL to check and download updates from.
publish:
  provider: github
  owner: MISQZY
  repo: OBScure

icon: build/icon.ico

files:
  - out/**/*
  - resources/**/*
  - package.json

extraResources:
  - from: overlays
    to: overlays

win:
  target:
    - nsis
    - portable

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  artifactName: ${productName}-${version}-setup.${ext}

portable:
  artifactName: ${productName}-${version}.${ext}
