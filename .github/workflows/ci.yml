name: CI

# Every push (any branch): lint + typecheck only.
# A release tag push (vX.Y.Z): lint + typecheck, then a single build+publish
# job that builds both the NSIS installer and the portable exe and publishes
# them to a GitHub Release (with latest.yml) so the in-app updater
# (electron-updater, see src/main/updater.ts) has something to check against.
# Adjust the `tags` pattern below if this project doesn't tag releases as v*.*.*.
on:
  push:
    branches:
      - '**'
    tags:
      - 'v*.*.*'

permissions:
  contents: read

env:
  NODE_VERSION: 20

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  # Windows target (NSIS/portable) is built on a GitHub-hosted windows-latest
  # runner rather than cross-compiled, so electron-builder's native NSIS
  # tooling and Electron's Windows binaries just work without extra setup.
  #
  # Build and publish are deliberately separate steps: electron-builder's
  # own --publish flag has each target's publisher independently find-or-
  # create the GitHub Release for the tag, and running that twice (once per
  # target) races — both can miss each other's in-flight release object and
  # each ends up publishing to a different one, silently dropping assets.
  # Building with --publish never just packages files into dist/ (electron-
  # builder still writes latest.yml/.blockmap there since a `publish` config
  # is present in electron-builder.yml — see PublishManager, that part isn't
  # gated on actually publishing), then a single `gh release create` call
  # uploads everything in one atomic release, no race possible.
  release:
    name: Build & publish release
    needs: [lint, typecheck]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Cache electron-builder downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: ${{ runner.os }}-electron-builder-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-builder-
      - run: npm ci
      - run: npm run build
      - name: Build NSIS installer
        run: npx electron-builder --win nsis --publish never
      - name: Build portable
        run: npx electron-builder --win portable --publish never
      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            dist/*-installer.exe \
            dist/*-installer.exe.blockmap \
            dist/*-portable.exe \
            dist/latest.yml \
            --title "${{ github.ref_name }}" \
            --generate-notes
