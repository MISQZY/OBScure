name: CI

# Every push (any branch): lint + typecheck only.
# A release tag push (vX.Y.Z): lint + typecheck, then a single build+publish
# job that builds both the NSIS installer and the portable exe and publishes
# them to a GitHub Release (with latest.yml) so the in-app updater
# (electron-updater, see src/main/updater.ts) has something to check against.
# Adjust the `tags` pattern below if this project doesn't tag releases as v*.*.*.
on:
  push:
    branches:
      - '**'
    tags:
      - 'v*.*.*'

permissions:
  contents: read

env:
  NODE_VERSION: 20

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  # Windows target (NSIS/portable) is built on a GitHub-hosted windows-latest
  # runner rather than cross-compiled, so electron-builder's native NSIS
  # tooling and Electron's Windows binaries just work without extra setup.
  # Both targets are built and published in one job, as two sequential steps
  # (see the comment below) so they land on a single GitHub Release without
  # racing each other to create it.
  release:
    name: Build & publish release
    needs: [lint, typecheck]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Cache electron-builder downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: ${{ runner.os }}-electron-builder-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-builder-
      - run: npm ci
      - run: npm run build
      # Built and published as two sequential invocations, not one
      # `--win nsis portable`, because publishing both targets in the same
      # electron-builder process races to create the GitHub Release for a
      # tag that doesn't exist yet — each target's publisher can miss the
      # other's in-flight draft and both end up creating one, leaving two
      # duplicate releases. Running them one after another means the second
      # invocation finds the release the first one already created.
      - name: Build and publish (NSIS installer)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win nsis --publish always
      - name: Build and publish (portable)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win portable --publish always
